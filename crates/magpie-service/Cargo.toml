[package]
name = "magpie-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
magpie-core.workspace = true
bytes = "=1.11.1"
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
http-body-util = "=0.1.3"
hyper = { version = "=1.7.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.17", default-features = false, features = ["tokio"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["stream", "rustls-tls"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
