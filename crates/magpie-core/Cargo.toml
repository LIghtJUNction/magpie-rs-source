[package]
name = "magpie-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
toml_edit.workspace = true
getrandom = "=0.3.4"
sha2 = "=0.10.9"
zeroize = "=1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }
