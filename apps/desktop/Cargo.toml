[workspace]
resolver = "3"

[package]
name = "magpie-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[features]
default = []
visual-test = ["gpui/test-support"]

[[example]]
name = "render_preview"
path = "examples/render_preview.rs"
required-features = ["visual-test"]

[dependencies]
magpie-core = { path = "../../crates/magpie-core" }
accesskit = "=0.24.1"
async-io = "=2.6.0"
async-process = "=2.5.0"
futures-lite = "=2.6.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-segmentation = "=1.13.3"
gpui = { package = "gpui-kit", git = "https://github.com/longbridge/gpui-kit", rev = "bb85882e1faab845d9e7be33b69a152879a90f69" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394", default-features = false, features = ["buttons", "selection", "navigation", "inputs", "feedback", "containment", "embedded-symbols"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["process", "fs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[patch.crates-io]
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-pre = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-pre-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-pre-web = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-fast = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-fast-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-fast-web = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "47895b92558883d24e19d54fdeb876ed551d9394" }
