[workspace]
resolver = "3"

[package]
name = "magpie-desktop"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
magpie-core = { path = "../../crates/magpie-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", default-features = false, features = ["windows-manifest"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
